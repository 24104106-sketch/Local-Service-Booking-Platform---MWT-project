<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b2e" />
      <stop offset="100%" stop-color="#242d4c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect width="800" height="480" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="120" r="140" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="650" cy="360" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Technical Room Backdrop Floor & Wall Line -->
  <path d="M 0 380 L 800 380" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />
  <path d="M 0 380 L 800 480" fill="rgba(0, 0, 0, 0.3)" />

  <!-- Central Service Workstation Illustration -->
  <g transform="translate(60, 40)">
    <!-- Main Device Card Base -->
    <rect x="20" y="30" width="640" height="300" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

    <!-- Interior Work Bench / Equipment Container -->
    <rect x="40" y="50" width="600" height="260" rx="14" fill="rgba(6, 11, 22, 0.75)" stroke="rgba(255, 255, 255, 0.06)" />

    <!-- Service Icon Badge Floating -->
    <g transform="translate(60, 75)">
      <circle cx="36" cy="36" r="36" fill="#818cf8" opacity="0.2" />
      <circle cx="36" cy="36" r="30" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <text x="36" y="44" font-size="28" text-anchor="middle">💻</text>
    </g>

    <!-- Workstation Graphic Representation -->
    <g transform="translate(160, 75)">
      <rect x="0" y="0" width="460" height="70" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="20" y="28" fill="#ffffff" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700">Laptop / Computer Repair</text>
      <text x="20" y="52" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Motherboard Chip-Level & Hardware Upgrade</text>
    </g>

    <!-- Visual Equipment Display -->
    <g transform="translate(60, 165)">
      <!-- Panel 1 -->
      <rect x="0" y="0" width="260" height="125" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <path d="M 20 40 L 100 40 M 20 60 L 160 60 M 20 80 L 120 80" stroke="#818cf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <circle cx="210" cy="62" r="30" fill="none" stroke="#818cf8" stroke-width="4" stroke-dasharray="120 40" />
      <text x="210" y="67" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">ACTIVE</text>
      <text x="20" y="108" fill="#38bdf8" font-size="11" font-weight="600">✓ Diagnostic Ready</text>

      <!-- Panel 2 (Technician & Status) -->
      <rect x="280" y="0" width="280" height="125" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <g transform="translate(300, 20)">
        <circle cx="20" cy="20" r="18" fill="#818cf8" opacity="0.25" />
        <text x="20" y="26" font-size="16" text-anchor="middle">👨‍🔧</text>
        <text x="50" y="16" fill="#f8fafc" font-size="13" font-weight="700">Verified Expert Assigned</text>
        <text x="50" y="32" fill="#64748b" font-size="11">Background Verified & Certified</text>
      </g>
      <g transform="translate(300, 70)">
        <rect x="0" y="0" width="240" height="36" rx="8" fill="rgba(37, 99, 235, 0.15)" stroke="rgba(59, 130, 246, 0.3)" />
        <text x="12" y="22" fill="#93c5fd" font-size="11.5" font-weight="600">🛡️ 30-Day Service Guarantee Included</text>
      </g>
    </g>
  </g>

  <!-- Bottom Floating Highlights Bar -->
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="640" height="52" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.12)" />
    <text x="30" y="31" fill="#e2e8f0" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">⚡ Instant Booking</text>
    <circle cx="170" cy="26" r="3" fill="#64748b" />
    <text x="200" y="31" fill="#e2e8f0" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">🔒 Transparent Rates</text>
    <circle cx="370" cy="26" r="3" fill="#64748b" />
    <text x="400" y="31" fill="#e2e8f0" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">📍 Doorstep Service</text>
    <text x="570" y="31" fill="#818cf8" font-size="13" font-weight="700">FixIt Local</text>
  </g>
</svg>