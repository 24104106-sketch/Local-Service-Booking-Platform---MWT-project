<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="thumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06282d" />
      <stop offset="100%" stop-color="#0d434a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="280" fill="url(#thumbGrad)" />

  <!-- Accent Circle -->
  <circle cx="200" cy="110" r="75" fill="#2dd4bf" opacity="0.12" />

  <!-- Frame & Card -->
  <rect x="20" y="20" width="360" height="240" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" />

  <!-- Icon Center -->
  <circle cx="200" cy="95" r="42" fill="#0f172a" stroke="#2dd4bf" stroke-width="2" />
  <text x="200" y="107" font-size="34" text-anchor="middle">🚿</text>

  <!-- Titles -->
  <text x="200" y="170" fill="#ffffff" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">Bathroom Tile & Grout Scrubbing</text>
  <text x="200" y="196" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Hard-water stain removal & descaling</text>

  <!-- Step Tag -->
  <g transform="translate(140, 220)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="rgba(37, 99, 235, 0.2)" stroke="#2dd4bf" stroke-width="1" />
    <text x="60" y="16" fill="#2dd4bf" font-size="10" font-weight="700" text-anchor="middle">VERIFIED STEP</text>
  </g>
</svg>